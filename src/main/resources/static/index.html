<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Shop</title>
  <style>
    body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);margin:0}
    .wrap{max-width:1100px;margin:auto;padding:20px}
    .hero{color:#fff;text-align:center}
    .top{display:grid;grid-template-columns:3fr 1fr;gap:20px;align-items:start}
    .panel,.cart{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
    .card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 25px rgba(0,0,0,.15)}
    button{background:#667eea;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}
    .emoji{font-size:60px}
    .search{margin-bottom:18px}
    .search label{display:block;font-weight:700;margin-bottom:8px}
    .search input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d9d9e3;border-radius:12px;font-size:16px}
    .empty-state{padding:18px;border-radius:14px;background:#f6f7fb;color:#555;text-align:center}
    .muted{color:#666}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>🛒 Modern Shopping Cart</h1>
      <p>Capstone Demo Application</p>
    </div>
    <div class="top">
      <div class="panel">
        <div class="search">
          <label for="product-search">Search products</label>
          <input id="product-search" type="search" placeholder="Search by product name" autocomplete="off" aria-describedby="search-help">
          <div id="search-help" class="muted">Type a product name prefix to filter the catalog.</div>
        </div>
        <div id="results"></div>
      </div>
      <div class="cart">
        <h3>Cart</h3>
        <div id="items"></div>
        <h2>₹ <span id="total">0</span></h2>
        <button id="checkout-button" type="button">Checkout</button>
      </div>
    </div>
  </div>
  <script type="module" src="/storefront.mjs"></script>
</body>
</html>
