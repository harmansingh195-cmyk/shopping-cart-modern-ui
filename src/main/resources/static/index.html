<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Modern Shop</title><style>body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{color:#fff;text-align:center}.toolbar{margin:20px 0;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 25px rgba(0,0,0,.15)}.toolbar input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:1rem;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card,.cart{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 25px rgba(0,0,0,.15)}button{background:#667eea;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer}.top{display:grid;grid-template-columns:3fr 1fr;gap:20px}.emoji{font-size:60px}</style></head><body><div class="wrap"><div class="hero"><h1>🛒 Modern Shopping Cart</h1><p>Capstone Demo Application</p></div><div class="toolbar"><label for="searchInput" style="display:block;margin-bottom:8px;font-weight:bold;color:#333;">Search products</label><input id="searchInput" type="search" placeholder="Search products by name" aria-label="Search products by name"></div><div class="top"><div><div class="grid" id="products"></div></div><div class="cart"><h3>Cart</h3><div id="items"></div><h2>₹ <span id="total">0</span></h2><button onclick="checkout()">Checkout</button></div></div></div><script>let products=[],cart=[];const productsContainer=document.getElementById('products');const searchInput=document.getElementById('searchInput');function loadProducts(query=''){const url=query ? `/api/products?name=${encodeURIComponent(query)}` : '/api/products';fetch(url).then(r=>r.json()).then(d=>{products=d;renderProducts(products);});}searchInput.addEventListener('input',()=>loadProducts(searchInput.value.trim()));loadProducts();function renderProducts(list){productsContainer.innerHTML=list.map(p=>`<div class=card><div class=emoji>${p.image}</div><h3>${p.name}</h3><p>₹${p.price}</p><button onclick=add(${p.id})>Add To Cart</button></div>`).join('')}function add(id){cart.push(products.find(x=>x.id===id));render()}function render(){document.getElementById('items').innerHTML=cart.map(x=>'<p>'+x.name+'</p>').join('');document.getElementById('total').innerText=cart.reduce((a,b)=>a+b.price,0)}function checkout(){alert('Order placed successfully! Total ₹'+document.getElementById('total').innerText);cart=[];render()}</script></body></html>
